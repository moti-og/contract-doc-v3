services:
  # Main server - serves API, frontend, and static assets
  - type: web
    name: contract-doc-server
    env: node
    plan: free
    buildCommand: cd server && npm ci --production && mkdir -p ./data/app && cp -r ../data/app ./data/ || echo "Data directory copy failed, continuing..."
    startCommand: cd server && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_PROVIDER
        value: ollama
      - key: OLLAMA_MODEL
        value: gemma3:1b
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: ALLOW_HTTP
        value: true
      - key: RENDER
        value: true
      - key: USE_MEMORY_STORAGE
        value: true
      - key: SUPERDOC_BASE_URL
        fromService:
          type: web
          name: contract-doc-collab
          property: host
      - key: SUPERDOC_FALLBACK_URL
        value: http://contract-doc-collab.onrender.com

  # Collaboration backend - WebSocket server for real-time editing
  - type: web
    name: contract-doc-collab
    env: node
    plan: free
    buildCommand: cd collab && npm ci
    startCommand: cd collab && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPERDOC_PORT
        value: 4100

  # Word Add-in - Static site serving add-in files
  - type: web
    name: contract-doc-addin
    env: node
    plan: free
    buildCommand: cd addin && npm ci && npm run build
    startCommand: npx serve -s addin/dist -l 10000
    envVars:
      - key: NODE_ENV
        value: production

  # Web client is served by the main server (contract-doc-server)
  # No separate static site needed - the main server serves /view, /vendor/, /ui/, /web/
