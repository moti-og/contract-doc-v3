<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commenting Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Commenting Prototype</h1>
      <p class="subtitle">Three panels: Comments (in‑doc), Messages (external), Summary/Controls</p>
    </header>

    <main class="grid">
      <!-- Option A: Split-view Threads + Details (editor-centric) -->
      <section class="panel" id="optionA">
        <div class="panel__header">
          <h2>Option A • Split View <span class="badge" id="aBadge">0</span></h2>
          <div class="filters">
            <label><input type="checkbox" id="aFilterInternal" checked /> Internal</label>
            <label><input type="checkbox" id="aFilterExternal" checked /> External</label>
            <label><input type="checkbox" id="aFilterPrivileged" /> Privileged</label>
          </div>
        </div>
        <div class="panel__body body--split">
          <div class="split__list" id="aList"></div>
          <div class="split__detail" id="aDetail"><div class="placeholder">Select a thread</div></div>
        </div>
        <div class="panel__footer"><button id="aAddComment">Add Comment</button><button id="aAddMessage">New Message</button></div>
      </section>

      <!-- Option B: Anchor-first Map + Channel Tabs (reviewer-centric) -->
      <section class="panel" id="optionB">
        <div class="panel__header">
          <h2>Option B • Anchor Map <span class="badge" id="bBadge">0</span></h2>
          <div class="filters">
            <label><input type="checkbox" id="bFilterInternal" checked /> Internal</label>
            <label><input type="checkbox" id="bFilterExternal" checked /> External</label>
            <label><input type="checkbox" id="bFilterPrivileged" /> Privileged</label>
          </div>
        </div>
        <div class="panel__body">
          <div class="anchor-map" id="bMap"></div>
          <div class="tabs">
            <button class="tab tab--active" data-tab="comments" id="bTabComments">Comments</button>
            <button class="tab" data-tab="messages" id="bTabMessages">Messages</button>
          </div>
          <div class="grouped" id="bContent"></div>
        </div>
        <div class="panel__footer"><button id="bAddComment">Add Comment</button><button id="bAddMessage">New Message</button></div>
      </section>

      <!-- Option C: Unified Inbox + Facets (manager/triage-centric) -->
      <section class="panel" id="optionC">
        <div class="panel__header">
          <h2>Option C • Unified Inbox <span class="badge" id="cBadge">0</span></h2>
          <div class="filters facets">
            <select id="cFacetChannel">
              <option value="all">All</option>
              <option value="comments">Comments</option>
              <option value="messages">Messages</option>
            </select>
            <select id="cFacetVisibility">
              <option value="both">Internal+External</option>
              <option value="internal">Internal only</option>
              <option value="external">External only</option>
            </select>
            <select id="cFacetPrivileged">
              <option value="nonpriv">Non-privileged</option>
              <option value="priv">Privileged</option>
              <option value="both">Both</option>
            </select>
            <select id="cFacetState">
              <option value="open">Open/Unresolved</option>
              <option value="all">All</option>
            </select>
          </div>
        </div>
        <div class="panel__body" id="cFeed"></div>
        <div class="panel__footer">
          <label><input type="checkbox" id="cIncludeInternal" /> Include Internal</label>
          <label><input type="checkbox" id="cIncludePrivileged" /> Include Privileged</label>
          <button id="cExport">Simulate Export</button>
        </div>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
  </html>
